name: Bug report
description: Report a reproducible problem in AgentOS
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove secrets and personal data from logs before submitting."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ...\n2. Configure ...\n3. Observe ..."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - Both Windows and Linux
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.x"
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Do not include API keys, tokens, or private source code.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
